# Builds the unsigned PhoneLanProxy.ipa that AltStore / SideStore re-sign on install.
# Every run uploads it as a workflow artifact; a pushed v* tag also publishes it as a
# GitHub Release, downloadable on the phone from
# https://github.com/<owner>/<repo>/releases/latest/download/PhoneLanProxy.ipa
name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/build_ipa.sh build "MARKETING_VERSION=${GITHUB_REF_NAME#v}" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          else
            scripts/build_ipa.sh build "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLanProxy-ipa
          path: build/PhoneLanProxy.ipa
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/PhoneLanProxy.ipa --title "$GITHUB_REF_NAME" --generate-notes
